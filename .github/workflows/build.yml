name: Build Kernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build kernel (clean)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libyaml-dev \
            gcc-aarch64-linux-gnu python3 git

      - name: Configure kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            gta4lve_eur_open_defconfig

      - name: Install Clang 11.0.1
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-11.0.1/clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.04.tar.xz
          sudo tar -xf clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.04.tar.xz -C /opt
          echo "/opt/clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.04/bin" >> $GITHUB_PATH

      - name: Build kernel
        run: |
          make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- WT_BSP_BOARD_NAME=P15945AA1 \
            -j$(nproc) Image dtbs 2>&1 | tee build.log

      - name: Print errors to summary
        if: always()
        run: |
          echo "## Build Errors" >> $GITHUB_STEP_SUMMARY
          if grep -i "error:" build.log; then
            grep -i "error:" build.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No errors found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-clean
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn