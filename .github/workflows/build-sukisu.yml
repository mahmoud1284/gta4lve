name: Build Kernel (SukiSU Ultra + SUSFS + NoMount)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build kernel with SukiSU Ultra, SUSFS and NoMount
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libyaml-dev \
            gcc-aarch64-linux-gnu python3 git patch curl

      - name: Get toolchains (AOSP clang r383902 = clang 11.0.1)
        run: |
          git clone --depth 1 -b android11-dev https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          ls clang-prebuilt | grep r383902
          echo "$PWD/clang-prebuilt/clang-r383902/bin" >> "$GITHUB_PATH"

      - name: Verify compiler (must be AOSP clang 11)
        run: |
          which clang
          clang --version | head -1
          clang --version | head -1 | grep -q "clang version 11"
          ld.lld --version | head -1
          aarch64-linux-gnu-ar --version | head -1
          aarch64-linux-gnu-objdump --version | head -1

      - name: Integrate SukiSU (builtin, Non-GKI compatible)
        run: |
          set -euo pipefail
          # Use a Non-GKI-focused SukiSU builtin fork for better 4.14 compatibility.
          curl -LSs "https://raw.githubusercontent.com/xiziya/SukiSU_Non-GKI/builtin/kernel/setup.sh" | bash
          if [ ! -e drivers/kernelsu ]; then
            echo "SukiSU integration failed: drivers/kernelsu not found"
            exit 1
          fi
          # 4.14 kernels use access_ok(type, addr, size); patch KPM calls if present.
          if [ -f drivers/kernelsu/kpm/kpm.c ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('drivers/kernelsu/kpm/kpm.c')
          s = p.read_text()
          # Convert common 2-arg access_ok(addr, size) forms to 3-arg for older kernels.
          # Heuristic: read checks -> VERIFY_READ, write checks -> VERIFY_WRITE where obvious.
          patterns = [
              (r'access_ok\(\s*args\s*,', 'access_ok(VERIFY_READ, args,'),
              (r'access_ok\(\s*arg2\s*,', 'access_ok(VERIFY_READ, arg2,'),
              (r'access_ok\(\s*arg3\s*,', 'access_ok(VERIFY_READ, arg3,'),
              (r'access_ok\(\s*arg4\s*,', 'access_ok(VERIFY_READ, arg4,'),
              (r'access_ok\(\s*arg5\s*,', 'access_ok(VERIFY_READ, arg5,'),
              (r'access_ok\(\s*out_info\s*,', 'access_ok(VERIFY_WRITE, out_info,'),
              (r'access_ok\(\s*ctl_args\s*,', 'access_ok(VERIFY_READ, ctl_args,'),
              (r'access_ok\(\s*buf\s*,', 'access_ok(VERIFY_WRITE, buf,'),
          ]
          for pat, rep in patterns:
              s = re.sub(pat, rep, s)
          # Generic fallback: access_ok(x, y) -> access_ok(VERIFY_READ, x, y) when only 2 args remain.
          s = re.sub(r'access_ok\(\s*([^,\n]+?)\s*,\s*([^,\n]+?)\s*\)', lambda m: f'access_ok(VERIFY_READ, {m.group(1).strip()}, {m.group(2).strip()})' if m.group(0).count(',') == 1 else m.group(0), s)
          p.write_text(s)
          PY
          fi
          echo "SukiSU (builtin, Non-GKI compatible) integrated"

      - name: Integrate SUSFS (kernel-4.14)
        run: |
          set -euo pipefail
          git clone --depth 1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          if [ -d /tmp/susfs4ksu/kernel_patches/fs ]; then
            cp -av /tmp/susfs4ksu/kernel_patches/fs/. fs/
          fi
          if [ -d /tmp/susfs4ksu/kernel_patches/include/linux ]; then
            mkdir -p include/linux
            cp -av /tmp/susfs4ksu/kernel_patches/include/linux/. include/linux/
          fi
          if [ -f /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch ]; then
            # Apply kernel-side SUSFS patch. This vendor 4.14.190 tree has known context conflicts;
            # apply with rejects and resolve the expected conflicts below.
            patch -p1 --forward --batch < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          def ensure_block(path, marker, block, after_regex=None):
              p = Path(path)
              s = p.read_text()
              if marker in s:
                  return
              if after_regex:
                  m = re.search(after_regex, s, re.M)
                  if not m:
                      raise SystemExit(f'anchor not found for {path}')
                  idx = m.end()
                  s = s[:idx] + block + s[idx:]
              else:
                  s = block + s
              p.write_text(s)

          # fs/namei.c: ensure susfs include exists
          namei = Path('fs/namei.c')
          s = namei.read_text()
          if 'CONFIG_KSU_SUSFS_SUS_PATH' not in s or '#include <linux/susfs_def.h>' not in s.split('CONFIG_KSU_SUSFS_SUS_PATH',1)[0][-200:]:
              s = s.replace('#include <linux/uaccess.h>\n',
                            '#include <linux/uaccess.h>\n#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif\n')
              namei.write_text(s)

          # fs/namespace.c: ensure susfs top-level defs
          ns = Path('fs/namespace.c')
          s = ns.read_text()
          if 'susfs_mnt_id_ida' not in s:
              s = s.replace('#include <linux/fslog.h>\n', '#include <linux/fslog.h>\n#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n#include <linux/susfs_def.h>\n#endif\n')
              insert_after = '#include "internal.h"\n'
              if insert_after not in s:
                  raise SystemExit('namespace.c internal.h include not found')
              sus_block = r'''
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          extern bool susfs_is_current_ksu_domain(void);
          extern bool susfs_is_current_zygote_domain(void);

          static DEFINE_IDA(susfs_mnt_id_ida);
          static DEFINE_IDA(susfs_mnt_group_ida);

          static int susfs_mnt_id_start = DEFAULT_SUS_MNT_ID;
          static int susfs_mnt_group_start = DEFAULT_SUS_MNT_GROUP_ID;

          #define CL_ZYGOTE_COPY_MNT_NS BIT(24) /* used by copy_mnt_ns() */
          #define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */
          #endif

          #ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          extern void susfs_auto_add_sus_ksu_default_mount(const char __user *to_pathname);
          bool susfs_is_auto_add_sus_ksu_default_mount_enabled = true;
          #endif
          #ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          extern int susfs_auto_add_sus_bind_mount(const char *pathname, struct path *path_target);
          bool susfs_is_auto_add_sus_bind_mount_enabled = true;
          #endif
          #ifdef CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          extern void susfs_auto_add_try_umount_for_bind_mount(struct path *path);
          bool susfs_is_auto_add_try_umount_for_bind_mount_enabled = true;
          #endif
          '''
              s = s.replace(insert_after, insert_after + sus_block + '\n')
              ns.write_text(s)

          # fs/proc/task_mmu.c: ensure sus_kstat include
          tmm = Path('fs/proc/task_mmu.c')
          s = tmm.read_text()
          if 'CONFIG_KSU_SUSFS_SUS_KSTAT' not in s:
              s = s.replace('#include <linux/ctype.h>\n', '#include <linux/ctype.h>\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n')
              tmm.write_text(s)

          # fs/readdir.c: compat_fillonedir sus_path filter
          rd = Path('fs/readdir.c')
          s = rd.read_text()
          old = '\tif (buf->result)\n\t\treturn -EINVAL;\n\td_ino = ino;\n\tif (sizeof(d_ino) < sizeof(ino) && d_ino != ino) {'
          if old in s and 'susfs_sus_ino_for_filldir64' not in s.split('compat_fillonedir',1)[1][:400]:
              new = '\tif (buf->result)\n\t\treturn -EINVAL;\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) && susfs_sus_ino_for_filldir64(ino)) {\n\t\treturn 0;\n\t}\n#endif\n\td_ino = ino;\n\tif (sizeof(d_ino) < sizeof(ino) && d_ino != ino) {'
              s = s.replace(old, new)
              rd.write_text(s)

          # fs/notify/fdinfo.c: ensure sus_mount-aware inotify/fanotify callbacks
          fdinfo = Path('fs/notify/fdinfo.c')
          s = fdinfo.read_text()
          if 'static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)' not in s:
              s = s.replace('static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n{',
                            '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nstatic void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)\n#else\nstatic void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n#endif\n{\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\t(void)file;\n#endif')
              fdinfo.write_text(s)
              s = fdinfo.read_text()
          if 'path.dentry->d_inode->i_ino, path.dentry->d_inode->i_sb->s_dev,' not in s:
              old = '''\tinode_mark = container_of(mark, struct inotify_inode_mark, fsn_mark);
          \tinode = igrab(mark->connector->inode);
          \tif (inode) {
          \t\t/*
          \t\t * IN_ALL_EVENTS represents all of the mask bits
          \t\t * that we expose to userspace.  There is at
          \t\t * least one bit (FS_EVENT_ON_CHILD) which is
          \t\t * used only internally to the kernel.
          \t\t */
          \t\tu32 mask = mark->mask & IN_ALL_EVENTS;
          \t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:%x ",
          \t\t\t   inode_mark->wd, inode->i_ino, inode->i_sb->s_dev,
          \t\t\t   mask, mark->ignored_mask);
          \t\tshow_mark_fhandle(m, inode);
          \t\tseq_putc(m, '\\n');
          \t\tiput(inode);
          \t}'''
              new = '''\tinode_mark = container_of(mark, struct inotify_inode_mark, fsn_mark);
          \tinode = igrab(mark->connector->inode);
          \tif (inode) {
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \t\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) &&
          \t\t    unlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {
          \t\t\tstruct path path;
          \t\t\tchar *pathname = kmalloc(PAGE_SIZE, GFP_KERNEL);
          \t\t\tchar *dpath;
          \t\t\tif (!pathname)
          \t\t\t\tgoto out_seq_printf;
          \t\t\tdpath = d_path(&file->f_path, pathname, PAGE_SIZE);
          \t\t\tif (!dpath)
          \t\t\t\tgoto out_free_pathname;
          \t\t\tif (kern_path(dpath, 0, &path))
          \t\t\t\tgoto out_free_pathname;
          \t\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:0 ",
          \t\t\t\t   inode_mark->wd, path.dentry->d_inode->i_ino,
          \t\t\t\t   path.dentry->d_inode->i_sb->s_dev,
          \t\t\t\t   inotify_mark_user_mask(mark));
          \t\t\tshow_mark_fhandle(m, path.dentry->d_inode);
          \t\t\tseq_putc(m, '\\n');
          \t\t\tiput(inode);
          \t\t\tpath_put(&path);
          \t\t\tkfree(pathname);
          \t\t\treturn;
          out_free_pathname:
          \t\t\tkfree(pathname);
          \t\t}
          out_seq_printf:
          #endif
          \t\t/*
          \t\t * IN_ALL_EVENTS represents all of the mask bits
          \t\t * that we expose to userspace.  There is at
          \t\t * least one bit (FS_EVENT_ON_CHILD) which is
          \t\t * used only internally to the kernel.
          \t\t */
          \t\tu32 mask = mark->mask & IN_ALL_EVENTS;
          \t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:%x ",
          \t\t\t   inode_mark->wd, inode->i_ino, inode->i_sb->s_dev,
          \t\t\t   mask, mark->ignored_mask);
          \t\tshow_mark_fhandle(m, inode);
          \t\tseq_putc(m, '\\n');
          \t\tiput(inode);
          \t}'''
              if old not in s:
                  # Fallback: minimal targeted replacement
                  s = s.replace('\t\tu32 mask = mark->mask & IN_ALL_EVENTS;',
                                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\t\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) &&\n\t\t    unlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {\n\t\t\tstruct path path;\n\t\t\tchar *pathname = kmalloc(PAGE_SIZE, GFP_KERNEL);\n\t\t\tchar *dpath;\n\t\t\tif (!pathname)\n\t\t\t\tgoto out_seq_printf;\n\t\t\tdpath = d_path(&file->f_path, pathname, PAGE_SIZE);\n\t\t\tif (!dpath)\n\t\t\t\tgoto out_free_pathname;\n\t\t\tif (kern_path(dpath, 0, &path))\n\t\t\t\tgoto out_free_pathname;\n\t\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:0 ",\n\t\t\t\t   inode_mark->wd, path.dentry->d_inode->i_ino,\n\t\t\t\t   path.dentry->d_inode->i_sb->s_dev,\n\t\t\t\t   inotify_mark_user_mask(mark));\n\t\t\tshow_mark_fhandle(m, path.dentry->d_inode);\n\t\t\tseq_putc(m, \'\\n\');\n\t\t\tiput(inode);\n\t\t\tpath_put(&path);\n\t\t\tkfree(pathname);\n\t\t\treturn;\n\t\t}\n\t\tgoto out_seq_printf;\nout_free_pathname:\n\t\tkfree(pathname);\nout_seq_printf:\n#endif\n\t\tu32 mask = mark->mask & IN_ALL_EVENTS;', 1)
              else:
                  s = s.replace(old, new)
              fdinfo.write_text(s)

          # Remove reject files from known-resolved conflicts to keep tree clean.
          for rej in ['fs/namei.c.rej','fs/namespace.c.rej','fs/proc/task_mmu.c.rej','fs/notify/fdinfo.c.rej','fs/readdir.c.rej']:
              p = Path(rej)
              if p.exists():
                  p.unlink()

          remaining = sorted(str(p) for p in Path('.').rglob('*.rej'))
          if remaining:
              print('Remaining SUSFS patch rejects:')
              for r in remaining:
                  print(' -', r)
              raise SystemExit(1)
          print('SUSFS integrated with conflict fixups')
          PY
          echo "SUSFS integrated"

      - name: Integrate NoMount
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/maxsteeel/nomount.git /tmp/nomount
          mkdir -p fs/nomount
          if [ -d /tmp/nomount/kernel/src ]; then
            cp -av /tmp/nomount/kernel/src/. fs/nomount/
          elif [ -d /tmp/nomount/kernel/fs/nomount ]; then
            cp -av /tmp/nomount/kernel/fs/nomount/. fs/nomount/
          else
            echo "NoMount kernel sources not found in expected paths"
            find /tmp/nomount -maxdepth 3 -type f | sed 's/^/  /' || true
            exit 1
          fi
          grep -q "obj-\$(CONFIG_NOMOUNT)" fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
          if [ -f fs/nomount/Kconfig ]; then
            grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig || sed -i '/^endmenu/i\source "fs/nomount/Kconfig"' fs/Kconfig
          fi
          echo "NoMount integrated"

      - name: Enable feature configs
        run: |
          set -euo pipefail
          DEFCONFIG=arch/arm64/configs/gta4lve_eur_open_defconfig
          # Keep essential device drivers and stock vendor module compatibility.
          sed -i 's/^# CONFIG_CHARGER_BQ25890 is not set$/CONFIG_CHARGER_BQ25890=y/' "$DEFCONFIG"
          grep -q '^CONFIG_CHARGER_BQ25890=y$' "$DEFCONFIG"
          sed -i 's/^CONFIG_JUMP_LABEL=y$/# CONFIG_JUMP_LABEL is not set/' "$DEFCONFIG"
          grep -q '^# CONFIG_JUMP_LABEL is not set$' "$DEFCONFIG"
          {
            echo ""
            echo "# SukiSU Ultra / SUSFS / NoMount"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            echo "CONFIG_NOMOUNT=y"
            echo "CONFIG_KPM=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> "$DEFCONFIG"
          echo "Feature configs enabled"

      - name: Patch sources for clang 11
        run: |
          set -euo pipefail
          # 1) -fmerge-constants is a GCC-only flag. Skip it for clang.
          sed -i -E 's|^(KBUILD_CFLAGS[[:space:]]+\+= )\$\(call cc-option,-fmerge-constants\)|\1$(if $(filter clang,$(cc-name)),,$(call cc-option,-fmerge-constants))|' Makefile
          grep -n "fmerge-constants" Makefile
          grep -q 'filter clang,$(cc-name)' Makefile

          # 2) Remove bare -Werror from vendor/kernel Makefiles so warnings do not break the build.
          grep -rlE '(^|[[:space:]])-Werror([[:space:]]|$)' --include=Makefile --include=Kbuild sound drivers arch/arm64 \
            | xargs -r sed -i -E 's/(^|[[:space:]])-Werror([[:space:]]|$)/\1\2/g'
          if grep -rE '(^|[[:space:]])-Werror([[:space:]]|$)' --include=Makefile --include=Kbuild sound drivers arch/arm64; then
            echo "bare -Werror still present"; exit 1
          fi
          git diff --stat | tail -20

      - name: Configure kernel
        shell: bash
        run: |
          make ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            WT_BSP_BOARD_NAME=P15945AA1 gta4lve_eur_open_defconfig 2>&1 | tee config.log
          grep -E '^CONFIG_(CHARGER_BQ25890|KSU|KSU_SUSFS|NOMOUNT|KPM|MODVERSIONS)=' .config

      - name: Check required configs
        run: |
          grep -q '^CONFIG_CHARGER_BQ25890=y$' .config
          grep -q '^CONFIG_KSU=y$' .config
          grep -q '^CONFIG_KPM=y$' .config
          grep -q '^CONFIG_MODVERSIONS=y$' .config
          ! grep -q '^CONFIG_JUMP_LABEL=y$' .config
          echo "required configs present"

      - name: Prepare kernel build
        shell: bash
        run: |
          make ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            WT_BSP_BOARD_NAME=P15945AA1 prepare

      - name: Build kernel
        shell: bash
        run: |
          make -k ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            WT_BSP_BOARD_NAME=P15945AA1 -j$(nproc) Image dtbs 2>&1 | tee build.log
          test -f arch/arm64/boot/Image
          ls -l arch/arm64/boot/Image
          strings arch/arm64/boot/Image | grep -m1 "Linux version" || true

      - name: Print errors to summary
        if: always()
        run: |
          {
            echo "## Compiler"
            echo '```'
            clang --version | head -1 || true
            echo '```'
            echo "## Build errors"
            echo '```'
            grep -E "error:|\*\*\* .*Error|No rule to make target|undefined reference|not found" build.log | head -80 || echo "none matched"
            echo '```'
            echo "## Last 40 lines of build.log"
            echo '```'
            tail -n 40 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-sukisu-susfs-nomount
          path: |
            build.log
            config.log
          if-no-files-found: warn

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sukisu-susfs-nomount
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: error