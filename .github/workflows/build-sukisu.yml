name: Build Kernel (SukiSU Ultra + SUSFS + NoMount)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build kernel with SukiSU Ultra, SUSFS and NoMount
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libyaml-dev \
            gcc-aarch64-linux-gnu python3 git patch curl

      - name: Get toolchains (AOSP clang r383902 = clang 11.0.1)
        run: |
          git clone --depth 1 -b android11-dev https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          ls clang-prebuilt | grep r383902
          echo "$PWD/clang-prebuilt/clang-r383902/bin" >> "$GITHUB_PATH"

      - name: Verify compiler (must be AOSP clang 11)
        run: |
          which clang
          clang --version | head -1
          clang --version | head -1 | grep -q "clang version 11"
          ld.lld --version | head -1
          aarch64-linux-gnu-ar --version | head -1
          aarch64-linux-gnu-objdump --version | head -1

      - name: Integrate SukiSU Ultra (builtin)
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          if [ ! -e drivers/kernelsu ]; then
            echo "SukiSU Ultra integration failed: drivers/kernelsu not found"
            exit 1
          fi
          echo "SukiSU Ultra commit: $(git -C KernelSU rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          # 4.14 compat: static_call.h is unavailable
          p = Path('drivers/kernelsu/kernel_includes.h')
          if p.exists():
              s = p.read_text()
              s = s.replace('#include <linux/static_call.h>\n',
                            '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5,10,0)\n#include <linux/static_call.h>\n#endif\n')
              p.write_text(s)

          # 4.14 compat: KPM uses 2-arg access_ok in newer code; kernel 4.14 expects 3 args.
          def fix_access_ok(path):
              p = Path(path)
              if not p.exists():
                  return
              orig = p.read_text()
              s = orig
              # Common 4.14 KPM case with nested call in first arg.
              s = re.sub(r'\baccess_ok\s*\(\s*u64_to_user_ptr\(\s*cmd\.result_code\s*\)\s*,\s*sizeof\(\s*result\s*\)\s*\)',
                         'access_ok(VERIFY_WRITE, u64_to_user_ptr(cmd.result_code), sizeof(result))', s)
              def repl(m):
                  inner = m.group(1).strip()
                  if inner.count(',') != 1:
                      return m.group(0)
                  a, b = [x.strip() for x in inner.split(',', 1)]
                  if a in ('VERIFY_READ', 'VERIFY_WRITE'):
                      return m.group(0)
                  if '(' in a or ')' in a:
                      return m.group(0)
                  write_like = a in ('out_info', 'buf', 'res', 'ctl_args') or b.endswith('out_sz') or b.endswith('buf_sz')
                  t = 'VERIFY_WRITE' if write_like else 'VERIFY_READ'
                  return f'access_ok({t}, {a}, {b})'
              s = re.sub(r'\baccess_ok\s*\(([^()\n]*(?:\([^()\n]*\)[^()\n]*)*)\)', repl, s)
              if s != orig:
                  p.write_text(s)

          for kpm_path in ['drivers/kernelsu/kpm/kpm.c', 'drivers/kernelsu/extension/kpm/kpm.c']:
              fix_access_ok(kpm_path)
          for kpm_path in Path('drivers/kernelsu').rglob('kpm*.c'):
              fix_access_ok(str(kpm_path))
          PYTHON
          echo "SukiSU Ultra (builtin) integrated"

      - name: Integrate SUSFS (kernel-4.14)
        run: |
          set -euo pipefail
          rm -rf /tmp/susfs4ksu
          git clone --depth 1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          if [ -d /tmp/susfs4ksu/kernel_patches/fs ]; then
            cp -av /tmp/susfs4ksu/kernel_patches/fs/. fs/
          fi
          if [ -d /tmp/susfs4ksu/kernel_patches/include/linux ]; then
            mkdir -p include/linux
            cp -av /tmp/susfs4ksu/kernel_patches/include/linux/. include/linux/
          fi
          if [ -f /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch ]; then
            # Apply kernel-side SUSFS patch. This vendor 4.14.190 tree has known context conflicts;
            # apply with rejects and resolve the expected conflicts below.
            patch -p1 --forward --batch < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch 2>&1 | tee susfs_patch.log || true
          fi

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          # fs/namei.c: ensure susfs include exists
          p = Path('fs/namei.c')
          s = p.read_text()
          if '#if defined(CONFIG_KSU_SUSFS_SUS_PATH)' not in s:
              s = s.replace('#include <linux/uaccess.h>\n',
                            '#include <linux/uaccess.h>\n#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif\n', 1)
              p.write_text(s)

          # fs/proc/task_mmu.c: ensure sus_kstat include/defs
          p = Path('fs/proc/task_mmu.c')
          s = p.read_text()
          if 'CONFIG_KSU_SUSFS_SUS_KSTAT' in s and '#include <linux/susfs_def.h>' not in s:
              inc = '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n'
              if '#include <linux/ctype.h>\n' in s:
                  s = s.replace('#include <linux/ctype.h>\n', '#include <linux/ctype.h>\n' + inc, 1)
              elif '#include <linux/mm_inline.h>\n' in s:
                  s = s.replace('#include <linux/mm_inline.h>\n', '#include <linux/mm_inline.h>\n' + inc, 1)
              else:
                  s = '#include <linux/susfs_def.h>\n' + s
              p.write_text(s)

          # fs/namespace.c: ensure susfs top-level defs required by susfs 1.5.5 patches
          p = Path('fs/namespace.c')
          s = p.read_text()
          if 'DEFINE_IDA(susfs_mnt_id_ida)' not in s:
              if '#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n#include <linux/susfs_def.h>\n#endif' not in s:
                  s = s.replace('#include <linux/fslog.h>\n', '#include <linux/fslog.h>\n#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n#include <linux/susfs_def.h>\n#endif\n', 1)
              block = '\n'
              block += '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
              block += 'extern bool susfs_is_current_ksu_domain(void);\n'
              block += 'extern bool susfs_is_current_zygote_domain(void);\n'
              block += '\n'
              block += 'static DEFINE_IDA(susfs_mnt_id_ida);\n'
              block += 'static DEFINE_IDA(susfs_mnt_group_ida);\n'
              block += '\n'
              block += 'static int susfs_mnt_id_start = DEFAULT_SUS_MNT_ID;\n'
              block += 'static int susfs_mnt_group_start = DEFAULT_SUS_MNT_GROUP_ID;\n'
              block += '\n'
              block += '#define CL_ZYGOTE_COPY_MNT_NS BIT(24) /* used by copy_mnt_ns() */\n'
              block += '#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n'
              block += '#endif\n'
              block += '\n'
              block += '#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT\n'
              block += 'extern void susfs_auto_add_sus_ksu_default_mount(const char __user *to_pathname);\n'
              block += 'bool susfs_is_auto_add_sus_ksu_default_mount_enabled = true;\n'
              block += '#endif\n'
              block += '#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT\n'
              block += 'extern int susfs_auto_add_sus_bind_mount(const char *pathname, struct path *path_target);\n'
              block += 'bool susfs_is_auto_add_sus_bind_mount_enabled = true;\n'
              block += '#endif\n'
              block += '#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT\n'
              block += 'extern void susfs_auto_add_try_umount_for_bind_mount(struct path *path);\n'
              block += 'bool susfs_is_auto_add_try_umount_for_bind_mount_enabled = true;\n'
              block += '#endif\n'
              if '#include "internal.h"\n' not in s:
                  raise SystemExit('namespace.c internal.h include not found')
              s = s.replace('#include "internal.h"\n', '#include "internal.h"\n' + block + '\n', 1)
              p.write_text(s)

          # fs/readdir.c: compat_fillonedir sus_path filter
          p = Path('fs/readdir.c')
          s = p.read_text()
          if 'compat_fillonedir' in s and 'susfs_sus_ino_for_filldir64(' not in s:
              old = '\tif (buf->result)\n\t\treturn -EINVAL;\n\td_ino = ino;\n\tif (sizeof(d_ino) < sizeof(ino) && d_ino != ino) {'
              new = '\tif (buf->result)\n\t\treturn -EINVAL;\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) && susfs_sus_ino_for_filldir64(ino)) {\n\t\treturn 0;\n\t}\n#endif\n\td_ino = ino;\n\tif (sizeof(d_ino) < sizeof(ino) && d_ino != ino) {'
              if old in s:
                  s = s.replace(old, new)
                  p.write_text(s)

          # fs/notify/fdinfo.c: sus_mount-aware callbacks for this kernel's fdinfo API
          p = Path('fs/notify/fdinfo.c')
          s = p.read_text()
          if 'static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)' not in s:
              s = s.replace('static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n{',
                            '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nstatic void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)\n#else\nstatic void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n#endif\n{\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\t(void)file;\n#endif', 1)
          if 'inotify_fdinfo' in s and 'out_free_pathname:' not in s.split('inotify_fdinfo', 1)[1][:2000]:
              old = '\tinode = igrab(mark->connector->inode);\n\tif (inode) {\n\t\t/*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t */\n\t\tu32 mask = mark->mask & IN_ALL_EVENTS;\n\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:%x ",\n\t\t\t   inode_mark->wd, inode->i_ino, inode->i_sb->s_dev,\n\t\t\t   mask, mark->ignored_mask);\n\t\tshow_mark_fhandle(m, inode);\n\t\tseq_putc(m, \'\\n\');\n\t\tiput(inode);\n\t}'
              new = '\tinode = igrab(mark->connector->inode);\n\tif (inode) {\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\t\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) &&\n\t\t    unlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {\n\t\t\tstruct path path;\n\t\t\tchar *pathname = kmalloc(PAGE_SIZE, GFP_KERNEL);\n\t\t\tchar *dpath;\n\t\t\tu32 mask = mark->mask & IN_ALL_EVENTS;\n\t\t\tif (!pathname)\n\t\t\t\tgoto out_seq_printf;\n\t\t\tdpath = d_path(&file->f_path, pathname, PAGE_SIZE);\n\t\t\tif (!dpath)\n\t\t\t\tgoto out_free_pathname;\n\t\t\tif (kern_path(dpath, 0, &path))\n\t\t\t\tgoto out_free_pathname;\n\t\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:0 ",\n\t\t\t\t   inode_mark->wd, path.dentry->d_inode->i_ino,\n\t\t\t\t   path.dentry->d_inode->i_sb->s_dev,\n\t\t\t\t   mask);\n\t\t\tshow_mark_fhandle(m, path.dentry->d_inode);\n\t\t\tseq_putc(m, \'\\n\');\n\t\t\tiput(inode);\n\t\t\tpath_put(&path);\n\t\t\tkfree(pathname);\n\t\t\treturn;\nout_free_pathname:\n\t\t\tkfree(pathname);\n\t\t}\nout_seq_printf:\n#endif\n\t\t{\n\t\t\tu32 mask = mark->mask & IN_ALL_EVENTS;\n\t\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:%x ",\n\t\t\t\t   inode_mark->wd, inode->i_ino, inode->i_sb->s_dev,\n\t\t\t\t   mask, mark->ignored_mask);\n\t\t\tshow_mark_fhandle(m, inode);\n\t\t\tseq_putc(m, \'\\n\');\n\t\t\tiput(inode);\n\t\t}\n\t}'
              if old in s:
                  s = s.replace(old, new)
              elif 'INODE_STATE_SUS_KSTAT' not in s and 'CONFIG_KSU_SUSFS_SUS_MOUNT' in s:
                  # If hunk 4 shape is different, do a targeted insertion before printing normal inotify info.
                  marker = '\t\tu32 mask = mark->mask & IN_ALL_EVENTS;\n\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:%x ",\n\t\t\t   inode_mark->wd, inode->i_ino, inode->i_sb->s_dev,\n\t\t\t   mask, mark->ignored_mask);'
                  if marker in s:
                      ins = '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\t\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) &&\n\t\t    unlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {\n\t\t\tstruct path path;\n\t\t\tchar *pathname = kmalloc(PAGE_SIZE, GFP_KERNEL);\n\t\t\tchar *dpath;\n\t\t\tu32 mask = mark->mask & IN_ALL_EVENTS;\n\t\t\tif (!pathname)\n\t\t\t\tgoto out_seq_printf;\n\t\t\tdpath = d_path(&file->f_path, pathname, PAGE_SIZE);\n\t\t\tif (!dpath)\n\t\t\t\tgoto out_free_pathname;\n\t\t\tif (kern_path(dpath, 0, &path))\n\t\t\t\tgoto out_free_pathname;\n\t\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:0 ",\n\t\t\t\t   inode_mark->wd, path.dentry->d_inode->i_ino,\n\t\t\t\t   path.dentry->d_inode->i_sb->s_dev,\n\t\t\t\t   mask);\n\t\t\tshow_mark_fhandle(m, path.dentry->d_inode);\n\t\t\tseq_putc(m, \'\\n\');\n\t\t\tiput(inode);\n\t\t\tpath_put(&path);\n\t\t\tkfree(pathname);\n\t\t\treturn;\nout_free_pathname:\n\t\t\tkfree(pathname);\n\t\t}\nout_seq_printf:\n#endif\n'
                      s = s.replace(marker, ins + marker, 1)
          p.write_text(s)

          # Remove known-resolved reject files and fail on any unexpected rejects.
          for rej in ['fs/namei.c.rej','fs/namespace.c.rej','fs/proc/task_mmu.c.rej','fs/notify/fdinfo.c.rej','fs/readdir.c.rej']:
              rp = Path(rej)
              if rp.exists():
                  rp.unlink()

          remaining = sorted(str(p) for p in Path('.').rglob('*.rej'))
          if remaining:
              print('Remaining SUSFS patch rejects:')
              for r in remaining:
                  print(' -', r)
              raise SystemExit(1)

          # Fail fast if expected SUSFS fixups are missing.
          checks = [
              ('fs/namespace.c', 'DEFINE_IDA(susfs_mnt_id_ida)'),
              ('fs/proc/task_mmu.c', 'CONFIG_KSU_SUSFS_SUS_KSTAT'),
          ]
          for path, marker in checks:
              txt = Path(path).read_text()
              if marker not in txt:
                  raise SystemExit(f'Missing expected SUSFS marker {marker} in {path}')
          task_mmu = Path('fs/proc/task_mmu.c').read_text()
          if 'INODE_STATE_SUS_KSTAT' in task_mmu and '#include <linux/susfs_def.h>' not in task_mmu:
              raise SystemExit('susfs_def.h include missing from fs/proc/task_mmu.c')
          print('SUSFS integrated with conflict fixups')
          PYTHON

          # SUSFS builtin mode relies on inline hooks inside the kernel patch. If they
          # are missing the kernel still builds but root silently never works.
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h
          for f in fs/exec.c fs/open.c fs/stat.c fs/read_write.c; do
            if grep -q 'ksu_handle_\|susfs_' "$f"; then
              echo "hook ok: $f"
            else
              echo "::error::no KernelSU/SUSFS hook found in $f (SUSFS patch hunk did not apply)"
              exit 1
            fi
          done
          echo "SUSFS integrated"

      - name: Integrate NoMount
        run: |
          set -euo pipefail
          rm -rf /tmp/nomount
          git clone --depth 1 https://github.com/maxsteeel/nomount.git /tmp/nomount
          mkdir -p fs/nomount
          if [ -d /tmp/nomount/kernel/src ]; then
            cp -av /tmp/nomount/kernel/src/. fs/nomount/
          elif [ -d /tmp/nomount/kernel/fs/nomount ]; then
            cp -av /tmp/nomount/kernel/fs/nomount/. fs/nomount/
          else
            echo "NoMount kernel sources not found in expected paths"
            find /tmp/nomount -maxdepth 3 -type f | sed 's/^/  /' || true
            exit 1
          fi
          grep -q "obj-\$(CONFIG_NOMOUNT)" fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
          if [ -f fs/nomount/Kconfig ]; then
            if ! grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig; then
              awk '/^endmenu/ { last = NR } { l[NR] = $0 }
                   END { for (i = 1; i <= NR; i++) { if (i == last) print "source \"fs/nomount/Kconfig\""; print l[i] } }' \
                fs/Kconfig > fs/Kconfig.tmp && mv fs/Kconfig.tmp fs/Kconfig
            fi
          fi
          echo "NoMount integrated"

      - name: Apply 4.14 SukiSU/SUSFS compatibility fixes
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          def patch_text(path, replacer):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text()
              ns = replacer(s)
              if ns != s:
                  p.write_text(ns)

          # Ensure SUSFS 1.5.5 headers provide flags/defs expected by patched kernel code.
          def fix_susfs_def(s):
              if 'TASK_STRUCT_NON_ROOT_USER_APP_PROC' not in s:
                  s += '\n#ifndef TASK_STRUCT_NON_ROOT_USER_APP_PROC\n#define TASK_STRUCT_NON_ROOT_USER_APP_PROC BIT(24)\n#endif\n'
              if 'INODE_STATE_SUS_KSTAT' not in s:
                  s += '\n#ifndef INODE_STATE_SUS_KSTAT\n#define INODE_STATE_SUS_KSTAT BIT(26)\n#endif\n'
              if 'CL_COPY_MNT_NS' not in s:
                  s += '\n#ifndef CL_COPY_MNT_NS\n#define CL_COPY_MNT_NS BIT(25)\n#endif\n#ifndef CL_ZYGOTE_COPY_MNT_NS\n#define CL_ZYGOTE_COPY_MNT_NS BIT(24)\n#endif\n'
              return s
          patch_text('include/linux/susfs_def.h', fix_susfs_def)

          # Bridge SukiSU Ultra's modern SUSFS supercall usage to susfs4ksu 1.5.5 kernel APIs.
          def fix_dispatch(s):
              s = s.replace('if (magic2 == SUSFS_MAGIC && current_uid().val == 0) {', 'if (current_uid().val == 0) {')
              repls = [
                  (r'susfs_add_sus_path\(arg\);', 'susfs_add_sus_path((struct st_susfs_sus_path __user *)*arg);'),
                  (r'susfs_add_sus_path_loop\(arg\);', 'susfs_add_sus_path((struct st_susfs_sus_path __user *)*arg);'),
                  (r'susfs_add_sus_kstat\(arg\);', 'susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)*arg);'),
                  (r'susfs_update_sus_kstat\(arg\);', 'susfs_update_sus_kstat((struct st_susfs_sus_kstat __user *)*arg);'),
                  (r'susfs_set_uname\(arg\);', 'susfs_set_uname((struct st_susfs_uname __user *)*arg);'),
                  (r'susfs_add_open_redirect\(arg\);', 'susfs_add_open_redirect((struct st_susfs_open_redirect __user *)*arg);'),
                  (r'susfs_set_cmdline_or_bootconfig\(arg\);', 'susfs_set_cmdline_or_bootconfig((char __user *)*arg);'),
                  (r'susfs_enable_log\(arg\);', 'susfs_set_log((bool)(unsigned long)*arg);'),
              ]
              for pat, rep in repls:
                  s = re.sub(pat, rep, s)

              # Remove/replace v2-only commands not present in 1.5.5.
              removals = [
                  r'\s*case CMD_SUSFS_ADD_SUS_PATH_LOOP:\s*\n\s*susfs_add_sus_path_loop\(.*?\);\s*\n\s*return 0;',
                  r'\s*case CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS:\s*\n\s*susfs_set_hide_sus_mnts_for_non_su_procs\(.*?\);\s*\n\s*return 0;',
                  r'\s*case CMD_SUSFS_ADD_SUS_MAP:\s*\n\s*susfs_add_sus_map\(.*?\);\s*\n\s*return 0;',
                  r'\s*case CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING:\s*\n\s*susfs_set_avc_log_spoofing\(.*?\);\s*\n\s*return 0;',
                  r'\s*case CMD_SUSFS_SHOW_ENABLED_FEATURES:\s*\n\s*susfs_get_enabled_features\(.*?\);\s*\n\s*return 0;',
                  r'\s*case CMD_SUSFS_SET_PRIORITY_UID_FILTER:\s*\n\s*susfs_set_priority_uid_filter\(.*?\);\s*\n\s*return 0;',
                  r'\s*case CMD_SUSFS_AVC_LOG_SPOOFING:\s*\n\s*susfs_set_avc_log_spoofing\(.*?\);\s*\n\s*return 0;',
              ]
              for pat in removals:
                  s = re.sub(pat, '\n            /* not supported by susfs4ksu 1.5.5 */', s, flags=re.S)

              s = re.sub(r'case CMD_SUSFS_SHOW_VARIANT:\s*\n\s*susfs_show_variant\(.*?\);\s*\n\s*return 0;',
                         'case CMD_SUSFS_SHOW_VARIANT:\n            return 0;', s)
              s = re.sub(r'case CMD_SUSFS_SHOW_VERSION:\s*\n\s*susfs_show_version\(.*?\);\s*\n\s*return 0;',
                         'case CMD_SUSFS_SHOW_VERSION:\n            return 0;', s)

              # Catch-all: drop any remaining unsupported SUSFS command cases/calls cleanly.
              s = re.sub(r'\n\s*case CMD_SUSFS_[A-Z0-9_]+:\s*\n\s*[^\n]*susfs_[a-z0-9_]*\([^;]*\);\s*\n\s*return 0;',
                         '\n            /* unsupported SUSFS command for 1.5.5 */', s)

              # Add 1.5.5 mount/try_umount commands when missing.
              if 'CMD_SUSFS_ADD_SUS_MOUNT' not in s and 'CONFIG_KSU_SUSFS_SUS_MOUNT' in s:
                  s = s.replace('#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT',
                                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n        case CMD_SUSFS_ADD_SUS_MOUNT:\n            susfs_add_sus_mount((struct st_susfs_sus_mount __user *)*arg);\n            return 0;', 1)
              if 'CMD_SUSFS_ADD_TRY_UMOUNT' not in s and 'CONFIG_KSU_SUSFS_TRY_UMOUNT' in s:
                  s = s.replace('#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT',
                                '#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT\n        case CMD_SUSFS_ADD_TRY_UMOUNT:\n            susfs_add_try_umount((struct st_susfs_try_umount __user *)*arg);\n            return 0;\n        case CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS:\n            susfs_try_umount(current_uid().val);\n            return 0;', 1)

              # Ensure 1.5.5 command IDs are available when SukiSU headers don't define them.
              if 'CMD_SUSFS_ADD_SUS_MOUNT' in s and '#ifndef CMD_SUSFS_ADD_SUS_MOUNT' not in s:
                  s = s.replace('#include <linux/susfs_def.h>', '#include <linux/susfs_def.h>\n#ifndef CMD_SUSFS_ADD_SUS_MOUNT\n#define CMD_SUSFS_ADD_SUS_MOUNT 0x55560\n#endif\n#ifndef CMD_SUSFS_ADD_TRY_UMOUNT\n#define CMD_SUSFS_ADD_TRY_UMOUNT 0x55580\n#endif\n#ifndef CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS\n#define CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS 0x555d0\n#endif', 1)
              return s
          patch_text('drivers/kernelsu/supercall/dispatch.c', fix_dispatch)

          # Avoid hard dependency on v2-only susfs helpers in other SukiSU code when building with 1.5.5.
          for path in Path('drivers/kernelsu').rglob('*.c'):
              sp = str(path)
              if sp.endswith('supercall/dispatch.c'):
                  continue
              s = path.read_text()
              if 'susfs_get_enabled_features(' in s:
                  s = s.replace('susfs_get_enabled_features(', '(0 /* compat 1.5.5 */)')
                  path.write_text(s)

          # Guard SUSFS extension code that expects newer susfs kernel symbols/APIs.
          for path in Path('drivers/kernelsu').rglob('susfs_extension.c'):
              s = path.read_text()
              s = re.sub(r'\bsusfs_show_variant\s*\([^)]*\)', '0', s)
              s = re.sub(r'\bsusfs_show_version\s*\([^)]*\)', '0', s)
              path.write_text(s)

          # Final sanity checks for common failure points.
          for kpm_path in Path('drivers/kernelsu').rglob('*.c'):
              s = kpm_path.read_text()
              if re.search(r'\baccess_ok\s*\(\s*u64_to_user_ptr\(\s*cmd\.result_code\s*\)\s*,\s*sizeof\(\s*result\s*\)\s*\)', s):
                  raise SystemExit(f'2-arg access_ok still present in {kpm_path}')
          if 'CMD_SUSFS_ADD_SUS_PATH_LOOP' in Path('drivers/kernelsu/supercall/dispatch.c').read_text():
              raise SystemExit('Unsupported SUSFS command still present in dispatch.c')
          if 'DEFINE_IDA(susfs_mnt_id_ida)' not in Path('fs/namespace.c').read_text():
              raise SystemExit('susfs_mnt_id_ida definition missing from fs/namespace.c')
          PYTHON

          # SukiSU Ultra (builtin, newer SUSFS integration API) vs susfs4ksu 1.5.5 kernel-4.14 compat.
          # Provide missing SUSFS helper symbols and fix 4.14-missing kernel APIs used by SukiSU.
          python3 - <<'PYTHON'
          import re
          from pathlib import Path

          # sulog/event.c: raw strncpy_from_user_nofault -> ksu wrapper (4.14 compat path)
          p = Path('KernelSU/kernel/sulog/event.c')
          if p.exists():
              s = p.read_text()
              if 'strncpy_from_user_nofault(' in s:
                  # replace raw calls but avoid double-prefixing wrapper calls
                  s = re.sub(r'(?<!ksu_)\bstrncpy_from_user_nofault\s*\(', 'ksu_strncpy_from_user_nofault(', s)
                  s = s.replace('ksu_ksu_strncpy_from_user_nofault(', 'ksu_strncpy_from_user_nofault(')
                  p.write_text(s)

          # kernel_compat.h: make ksu_strncpy_from_user_nofault header-safe and ensure uaccess include
          p = Path('KernelSU/kernel/kernel_compat.h')
          if p.exists():
              s = p.read_text()
              if '#include <linux/uaccess.h>' not in s:
                  s = s.replace('#include <linux/version.h>\n', '#include <linux/version.h>\n#include <linux/uaccess.h>\n', 1)
              s = s.replace(
                  '\nlong ksu_strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)\n{',
                  '\nstatic inline long ksu_strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)\n{'
              )
              p.write_text(s)

          # supercall/dispatch.c: kvcalloc is unavailable on 4.14
          p = Path('KernelSU/kernel/supercall/dispatch.c')
          if p.exists():
              s = p.read_text()
              if '#include <linux/mm.h>' not in s:
                  s = s.replace('#include <linux/kernel.h>\n', '#include <linux/kernel.h>\n#include <linux/mm.h>\n#include <linux/slab.h>\n', 1)
              s = s.replace('names = kvcalloc(cmd.count, sizeof(*names), GFP_KERNEL);',
                            'names = kvmalloc_array(cmd.count, sizeof(*names), GFP_KERNEL | __GFP_ZERO);')
              s = s.replace('addrs = kvcalloc(cmd.count, sizeof(*addrs), GFP_KERNEL);',
                            'addrs = kvmalloc_array(cmd.count, sizeof(*addrs), GFP_KERNEL | __GFP_ZERO);')
              s = s.replace('kfree(names);', 'kvfree(names);')
              s = s.replace('kfree(addrs);', 'kvfree(addrs);')
              p.write_text(s)

          # adb_root.c: declare compat helpers when SUSFS path is used
          p = Path('KernelSU/kernel/feature/adb_root.c')
          if p.exists():
              s = p.read_text()
              needle = '#ifdef CONFIG_KSU_SUSFS\nstatic inline long is_exec_adbd(const char *filename)\n{'
              decls = '#ifdef CONFIG_KSU_SUSFS\nextern bool susfs_starts_with(const char *str, const char *prefix);\nextern bool susfs_ends_with(const char *str, const char *suffix);\nstatic inline long is_exec_adbd(const char *filename)\n{'
              if needle in s and 'extern bool susfs_starts_with' not in s:
                  s = s.replace(needle, decls)
                  p.write_text(s)

          # lsm_hook.c: ensure workqueue types are available for susfs_extra_works usage
          p = Path('KernelSU/kernel/hook/lsm_hook.c')
          if p.exists():
              s = p.read_text()
              if 'extern struct work_struct susfs_extra_works;' in s and '#include <linux/workqueue.h>' not in s:
                  s = s.replace('#include <linux/cred.h>\n', '#include <linux/cred.h>\n#include <linux/workqueue.h>\n', 1)
                  p.write_text(s)

          compat_c = r'''#include <linux/types.h>
          #include <linux/string.h>
          #include <linux/cred.h>
          #include <linux/sched.h>
          #include <linux/workqueue.h>
          #include <linux/slab.h>
          #include <linux/mm.h>
          #include <linux/uaccess.h>
          #include "kernel_compat.h"
          
          #ifdef CONFIG_KSU_SUSFS
          #include <linux/susfs.h>
          #include <linux/susfs_def.h>
          
          bool susfs_starts_with(const char *str, const char *prefix)
          {
          	size_t len;
          
          	if (!str || !prefix)
          		return false;
          	len = strlen(prefix);
          	return strncmp(str, prefix, len) == 0;
          }
          
          bool susfs_ends_with(const char *str, const char *suffix)
          {
          	size_t str_len, suffix_len;
          
          	if (!str || !suffix)
          		return false;
          	str_len = strlen(str);
          	suffix_len = strlen(suffix);
          	if (suffix_len > str_len)
          		return false;
          	return memcmp(str + str_len - suffix_len, suffix, suffix_len) == 0;
          }
          
          void susfs_set_current_proc_no_su(void) {}
          void susfs_set_current_proc_umounted(void) {}
          void susfs_set_current_proc_umounted_for_zygote_next(void) {}
          
          static void susfs_extra_works_fn(struct work_struct *work) {}
          DECLARE_WORK(susfs_extra_works, susfs_extra_works_fn);
          
          void susfs_parse_priority_app_strings(void) {}
          void susfs_start_sdcard_monitor_fn(void) {}
          
          int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u16 type, u32 orig_avd_allowed)
          {
          	return 0;
          }
          
          #ifndef KSU_HAS_STRNCPY_FROM_USER_NOFAULT
          long strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)
          {
          	return ksu_strncpy_from_user_nofault(dst, unsafe_addr, count);
          }
          #endif
          
          #endif /* CONFIG_KSU_SUSFS */
          '''
          Path('KernelSU/kernel/susfs_compat_155.c').write_text(compat_c)
          
          mk = Path('KernelSU/kernel/Makefile')
          if mk.exists():
              s_mk = mk.read_text()
              if 'susfs_compat_155.o' not in s_mk:
                  s_mk += '\nifeq ($(CONFIG_KSU_SUSFS), y)\nksu-y += susfs_compat_155.o\nendif\n'
                  mk.write_text(s_mk)
          
          # sanity checks for reported link errors
          p = Path('KernelSU/kernel/sulog/event.c')
          if p.exists():
              txt = p.read_text()
              if re.search(r'(?<!ksu_)\bstrncpy_from_user_nofault\s*\(', txt):
                  raise SystemExit('raw strncpy_from_user_nofault still present in sulog/event.c')
          p = Path('KernelSU/kernel/supercall/dispatch.c')
          if p.exists() and 'kvcalloc(' in p.read_text():
              raise SystemExit('kvcalloc still present in supercall/dispatch.c')
          if not Path('KernelSU/kernel/susfs_compat_155.c').exists():
              raise SystemExit('susfs_compat_155.c missing')
          print('SukiSU/SUSFS 1.5.5 compat shims applied')
          PYTHON
          echo "4.14 SukiSU/SUSFS compatibility fixes applied"

      - name: Enable feature configs
        run: |
          set -euo pipefail
          DEFCONFIG=arch/arm64/configs/gta4lve_eur_open_defconfig
          # Keep essential device drivers and stock vendor module compatibility.
          sed -i 's/^# CONFIG_CHARGER_BQ25890 is not set$/CONFIG_CHARGER_BQ25890=y/' "$DEFCONFIG"
          grep -q '^CONFIG_CHARGER_BQ25890=y$' "$DEFCONFIG"
          sed -i 's/^CONFIG_JUMP_LABEL=y$/# CONFIG_JUMP_LABEL is not set/' "$DEFCONFIG"
          grep -q '^# CONFIG_JUMP_LABEL is not set$' "$DEFCONFIG"
          {
            echo ""
            echo "# SukiSU Ultra / SUSFS (1.5.5 kernel-4.14) / NoMount"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
            echo "CONFIG_NOMOUNT=y"
            echo "CONFIG_KPM=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> "$DEFCONFIG"
          echo "Feature configs enabled"

      - name: Patch sources for clang 11
        run: |
          set -euo pipefail
          # 1) -fmerge-constants is a GCC-only flag. Skip it for clang.
          sed -i -E 's|^(KBUILD_CFLAGS[[:space:]]+\+= )\$\(call cc-option,-fmerge-constants\)|\1$(if $(filter clang,$(cc-name)),,$(call cc-option,-fmerge-constants))|' Makefile
          grep -n "fmerge-constants" Makefile
          grep -q 'filter clang,$(cc-name)' Makefile

          # 2) Remove bare -Werror from vendor/kernel Makefiles so warnings do not break the build.
          grep -rlE '(^|[[:space:]])-Werror([[:space:]]|$)' --include=Makefile --include=Kbuild sound drivers arch/arm64 \
            | xargs -r sed -i -E 's/(^|[[:space:]])-Werror([[:space:]]|$)/\1\2/g'
          if grep -rE '(^|[[:space:]])-Werror([[:space:]]|$)' --include=Makefile --include=Kbuild sound drivers arch/arm64; then
            echo "bare -Werror still present"; exit 1
          fi
          git diff --stat | tail -20

      - name: Configure kernel
        shell: bash
        run: |
          make ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            WT_BSP_BOARD_NAME=P15945AA1 gta4lve_eur_open_defconfig 2>&1 | tee config.log
          grep -E '^CONFIG_(CHARGER_BQ25890|KSU|KSU_SUSFS|NOMOUNT|KPM|MODVERSIONS)=' .config

      - name: Check required configs
        run: |
          grep -q '^CONFIG_CHARGER_BQ25890=y$' .config
          grep -q '^CONFIG_KSU=y$' .config
          grep -q '^CONFIG_KPM=y$' .config
          grep -q '^CONFIG_MODVERSIONS=y$' .config
          ! grep -q '^CONFIG_JUMP_LABEL=y$' .config
          echo "required configs present"

      - name: Prepare kernel build
        shell: bash
        run: |
          make ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            WT_BSP_BOARD_NAME=P15945AA1 prepare

      - name: Build kernel
        shell: bash
        run: |
          make -k ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            WT_BSP_BOARD_NAME=P15945AA1 -j$(nproc) Image dtbs 2>&1 | tee build.log
          test -f arch/arm64/boot/Image
          ls -l arch/arm64/boot/Image
          strings arch/arm64/boot/Image | grep -m1 "Linux version" || true

      - name: Verify module CRCs against stock vendor modules
        continue-on-error: true
        shell: bash
        run: |
          # SUSFS adds fields to task_struct/inode. If that changes the CRC of a symbol
          # the stock vendor modules (mali_gondul, sprd_camera) import, the kernel will
          # reject them at boot (bootloop). This step lists every mismatch.
          test -f .github/vendor_crcs.txt || { echo "::warning::.github/vendor_crcs.txt missing, skipping CRC check"; exit 0; }
          python3 - <<'PY'
          import os, subprocess, sys
          need = {}
          for line in open(".github/vendor_crcs.txt"):
              if line.strip():
                  name, crc = line.split()
                  need[name] = int(crc, 16)
          out = subprocess.run(["llvm-nm", "vmlinux"], capture_output=True, text=True).stdout
          have = {}
          for line in out.splitlines():
              p = line.split()
              if len(p) == 3 and p[2].startswith("__crc_"):
                  have[p[2][6:]] = int(p[0], 16)
          bad = [(n, need[n], have.get(n)) for n in sorted(need) if have.get(n) != need[n]]
          lines = ["## Vendor module CRC check",
                   f"kernel exports {len(have)} CRCs, vendor modules need {len(need)}, mismatches: {len(bad)}"]
          if not have:
              lines.append("ERROR: no __crc_ symbols found in vmlinux (is CONFIG_MODVERSIONS on?)")
          for n, want, got in bad[:60]:
              lines.append(f"- {n}: vendor wants 0x{want:08x}, kernel has " + ("MISSING" if got is None else f"0x{got:08x}"))
          lines.append(f"module_layout: vendor 0x{need.get('module_layout', 0):08x}, kernel 0x{have.get('module_layout', 0):08x}")
          text = "\n".join(lines)
          print(text)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text + "\n")
          sys.exit(1 if (bad or not have) else 0)
          PY

      - name: Print errors to summary
        if: always()
        run: |
          {
            echo "## Compiler"
            echo '```'
            clang --version | head -1 || true
            echo '```'
            echo "## Build errors"
            echo '```'
            grep -E "error:|\*\*\* .*Error|No rule to make target|undefined reference|not found" build.log | head -80 || echo "none matched"
            echo '```'
            echo "## Last 40 lines of build.log"
            echo '```'
            tail -n 40 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-sukisu-susfs-nomount
          path: |
            build.log
            config.log
            susfs_patch.log
          if-no-files-found: warn

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sukisu-susfs-nomount
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: error
