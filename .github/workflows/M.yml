name: Build gta4lve 4.14.190 Kernel

on:
  workflow_dispatch:
    inputs:
      enable_bbg:
        description: "Enable BBG via the official v1.1 setup script"
        type: boolean
        default: true
      enable_rekernel:
        description: "Enable Re:Kernel 4.14 integration"
        type: boolean
        default: true
      enable_slmk:
        description: "Enable Simple LMK linux-4.14"
        type: boolean
        default: true
  push:
    paths:
      - ".github/workflows/build-kernel.yml"
      - "arch/arm64/configs/gta4lve_eur_open_defconfig"
      - "drivers/**"
      - "fs/**"
      - "mm/**"
      - "net/**"
      - "build_kernel.sh"
      - "patches/**"

permissions:
  contents: read

concurrency:
  group: gta4lve-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: gta4lve_eur_open_defconfig
  KERNEL_VERSION: 4.14.190
  NOMOUNT_REF: v2.3.0-720
  SUKISU_REF: main
  BBG_REF: v1.1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ccache clang lld llvm \
            libssl-dev libelf-dev libyaml-dev pahole python3 rsync unzip zip \
            device-tree-compiler git curl ca-certificates gcc-aarch64-linux-gnu

      - name: Verify kernel tree
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f arch/arm64/configs/${DEFCONFIG}
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 14$' Makefile
          grep -q '^SUBLEVEL = 190$' Makefile

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: |
            out
            .ccache
          key: ${{ runner.os }}-gta4lve-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gta4lve-

      - name: Apply legacy feature patches
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.enable_slmk }}" != "false" ]]; then
            test -f patches/simple-lmk-4.14.patch
            git apply --check patches/simple-lmk-4.14.patch
            git apply patches/simple-lmk-4.14.patch
          fi
          if [[ "${{ inputs.enable_rekernel }}" != "false" ]]; then
            test -f patches/rekernel-4.14.patch
            git apply --check patches/rekernel-4.14.patch
            git apply patches/rekernel-4.14.patch
          fi

      - name: Integrate SukiSU Ultra
        shell: bash
        run: |
          set -euo pipefail
          # builtin is the documented legacy/non-GKI route and exposes SUSFS options.
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SUKISU_REF}/kernel/setup.sh \
            | bash -s builtin

      - name: Integrate NoMount v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_REF}/kernel/setup.sh \
            | bash -s "${NOMOUNT_REF}"

      - name: Fetch feature sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          git clone --depth=1 --branch "${BBG_REF}" https://github.com/vc-teahouse/Baseband-guard.git third_party/baseband-guard

      - name: Integrate BBG v1.1
        if: ${{ inputs.enable_bbg != false }}
        shell: bash
        run: |
          set -euo pipefail
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/${BBG_REF}/setup.sh \
            | bash -s "${BBG_REF}"

      - name: Configure kernel features
        shell: bash
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 ${DEFCONFIG}
          set_config() {
            local symbol="$1" value="$2"
            if grep -qE "^(CONFIG_${symbol}=|# CONFIG_${symbol} is not set)" out/.config; then
              ./scripts/config --file out/.config --set-val "${symbol}" "${value}"
            else
              echo "INFO: CONFIG_${symbol} is not present; skipped"
            fi
          }
          set_config KSU y
          set_config KSU_SUSFS y
          set_config KPM y
          set_config KALLSYMS y
          set_config KALLSYMS_ALL y
          set_config NOMOUNT y
          if [[ "${{ inputs.enable_bbg }}" != "false" ]]; then
            set_config BBG y
          fi
          if [[ "${{ inputs.enable_rekernel }}" != "false" ]]; then
            set_config REKERNEL y
          fi
          if [[ "${{ inputs.enable_slmk }}" != "false" ]]; then
            set_config ANDROID_SIMPLE_LMK y
          fi
          set_config TCP_CONG_BBR y
          set_config DEFAULT_TCP_CONG bbr
          set_config ZRAM y
          set_config ZRAM_LZ4_COMPRESS y
          set_config CRYPTO_LZ4 y
          set_config LZ4_COMPRESS y
          # GCC 4.9 and the vendor clang in this tree do not implement
          # -fstack-protector-strong; regular stack protection is supported.
          ./scripts/config --file out/.config --disable CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config --enable CC_STACKPROTECTOR_REGULAR
          for gov in PERFORMANCE POWERSAVE USERSPACE ONDEMAND CONSERVATIVE INTERACTIVE SCHEDUTIL; do
            set_config CPU_FREQ_GOV_${gov} y
          done
          make O=out ARCH=arm64 olddefconfig
          required_symbols=(KSU KSU_SUSFS KPM KALLSYMS KALLSYMS_ALL NOMOUNT CC_STACKPROTECTOR_REGULAR)
          [[ "${{ inputs.enable_bbg }}" == "false" ]] || required_symbols+=(BBG)
          [[ "${{ inputs.enable_rekernel }}" == "false" ]] || required_symbols+=(REKERNEL)
          for required in "${required_symbols[@]}"; do
            grep -q "^CONFIG_${required}=y" out/.config || { echo "ERROR: CONFIG_${required} was not enabled"; exit 1; }
          done
          if [[ "${{ inputs.enable_slmk }}" != "false" ]]; then
            grep -q '^CONFIG_ANDROID_SIMPLE_LMK=y' out/.config || { echo 'ERROR: CONFIG_ANDROID_SIMPLE_LMK was not enabled'; exit 1; }
          fi
          grep -q '^# CONFIG_CC_STACKPROTECTOR_STRONG is not set$' out/.config || { echo 'ERROR: strong stack protector is still enabled'; exit 1; }
          grep -E 'CONFIG_(KSU|KPM|KALLSYMS|NOMOUNT|BBG|REKERNEL|ANDROID_SIMPLE_LMK|CC_STACKPROTECTOR|TCP_CONG_BBR|DEFAULT_TCP_CONG|ZRAM|CRYPTO_LZ4|CPU_FREQ_GOV_)' out/.config | sort > out/feature-config.txt
          cat out/feature-config.txt

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          # The repository does not contain the vendor toolchain. Use the
          # reproducible Ubuntu cross-GCC plus the runner's LLVM toolchain.
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH="/usr/lib/llvm-14/bin:${PATH}"
          export BSP_BUILD_FAMILY=qogirl6
          export DTC_OVERLAY_TEST_EXT="$(pwd)/tools/mkdtimg/ufdt_apply_overlay"
          export DTC_OVERLAY_VTS_EXT="$(pwd)/tools/mkdtimg/ufdt_verify_overlay_host"
          export BSP_BUILD_ANDROID_OS=y
          export USE_CCACHE=1
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          # Do not call build_kernel.sh here: it runs defconfig again and would
          # discard the feature changes made in the previous step.
          make -C . O=out BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld \
            ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- -j"$(nproc)"
          test -s out/arch/arm64/boot/Image

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp out/arch/arm64/boot/Image artifact/Image-gta4lve-${KERNEL_VERSION}
          cp out/.config artifact/config-${KERNEL_VERSION}
          cp out/feature-config.txt artifact/feature-config.txt
          tar -C artifact -czf gta4lve-${KERNEL_VERSION}.tar.gz .

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta4lve-${{ env.KERNEL_VERSION }}
          path: |
            artifact/Image-gta4lve-${{ env.KERNEL_VERSION }}
            artifact/config-${{ env.KERNEL_VERSION }}
            artifact/feature-config.txt
            gta4lve-${{ env.KERNEL_VERSION }}.tar.gz
          if-no-files-found: error
