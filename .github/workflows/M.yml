name: Build gta4lve 4.14.190 Kernel

on:
  workflow_dispatch:
    inputs:
      enable_bbg:
        description: "Enable BBG; requires patches/bbg.patch"
        type: boolean
        default: true
      enable_rekernel:
        description: "Enable Re:Kernel; requires patches/rekernel.patch"
        type: boolean
        default: true
      enable_slmk:
        description: "Enable Simple LMK linux-4.14"
        type: boolean
        default: true
  push:
    paths:
      - ".github/workflows/build-kernel.yml"
      - "arch/arm64/configs/gta4lve_eur_open_defconfig"
      - "drivers/**"
      - "fs/**"
      - "mm/**"
      - "net/**"
      - "build_kernel.sh"

permissions:
  contents: read

concurrency:
  group: gta4lve-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: gta4lve_eur_open_defconfig
  KERNEL_VERSION: 4.14.190
  NOMOUNT_REF: v2.3.0-720
  SUKISU_REF: main
  SLMK_REF: linux-4.14
  BBG_REF: v1.1
  REKERNEL_REF: main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ccache clang lld llvm \
            libssl-dev libelf-dev pahole python3 rsync unzip zip \
            device-tree-compiler git curl ca-certificates

      - name: Verify kernel tree
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f arch/arm64/configs/${DEFCONFIG}
          grep -q '^VERSION = 4$' Makefile
          grep -q '^PATCHLEVEL = 14$' Makefile
          grep -q '^SUBLEVEL = 190$' Makefile

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: |
            out
            .ccache
          key: ${{ runner.os }}-gta4lve-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gta4lve-

      - name: Integrate SukiSU Ultra
        shell: bash
        run: |
          set -euo pipefail
          # builtin is the documented legacy/non-GKI route and exposes SUSFS options.
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SUKISU_REF}/kernel/setup.sh \
            | bash -s builtin

      - name: Integrate NoMount v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_REF}/kernel/setup.sh \
            | bash -s "${NOMOUNT_REF}"

      - name: Fetch optional feature sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party
          git clone --depth=1 --branch "${SLMK_REF}" https://github.com/kerneltoast/simple_lmk.git third_party/simple_lmk
          git clone --depth=1 --branch "${BBG_REF}" https://github.com/vc-teahouse/Baseband-guard.git third_party/baseband-guard
          git clone --depth=1 --branch "${REKERNEL_REF}" https://github.com/Sakion-Team/Re-Kernel.git third_party/re-kernel

      - name: Integrate Simple LMK
        if: ${{ inputs.enable_slmk != false }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d third_party/simple_lmk/drivers/staging/android/lowmemorykiller ]; then
            mkdir -p drivers/staging/android
            cp -a third_party/simple_lmk/drivers/staging/android/lowmemorykiller drivers/staging/android/
          elif [ -d third_party/simple_lmk/drivers/misc/lowmemorykiller ]; then
            mkdir -p drivers/misc
            cp -a third_party/simple_lmk/drivers/misc/lowmemorykiller drivers/misc/
          else
            echo 'Simple LMK linux-4.14 layout is not compatible with this tree.' >&2
            exit 1
          fi

      - name: Apply BBG patch
        if: ${{ inputs.enable_bbg != false }}
        shell: bash
        run: |
          set -euo pipefail
          test -f patches/bbg.patch || { echo 'Add a tested device-specific patches/bbg.patch'; exit 1; }
          git apply --check patches/bbg.patch
          git apply patches/bbg.patch

      - name: Apply Re:Kernel patch
        if: ${{ inputs.enable_rekernel != false }}
        shell: bash
        run: |
          set -euo pipefail
          test -f patches/rekernel.patch || { echo 'Add a tested device-specific patches/rekernel.patch'; exit 1; }
          git apply --check patches/rekernel.patch
          git apply patches/rekernel.patch

      - name: Configure kernel features
        shell: bash
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 ${DEFCONFIG}
          set_config() {
            local symbol="$1" value="$2"
            if grep -qE "^(CONFIG_${symbol}=|# CONFIG_${symbol} is not set)" out/.config; then
              ./scripts/config --file out/.config --set-val "${symbol}" "${value}"
            else
              echo "INFO: CONFIG_${symbol} is not present; skipped"
            fi
          }
          set_config KSU y
          set_config KSU_SUSFS y
          set_config NOMOUNT y
          set_config TCP_CONG_BBR y
          set_config DEFAULT_TCP_CONG bbr
          set_config ZRAM y
          set_config ZRAM_LZ4_COMPRESS y
          set_config CRYPTO_LZ4 y
          set_config LZ4_COMPRESS y
          for gov in PERFORMANCE POWERSAVE USERSPACE ONDEMAND CONSERVATIVE INTERACTIVE SCHEDUTIL; do
            set_config CPU_FREQ_GOV_${gov} y
          done
          make O=out ARCH=arm64 olddefconfig
          grep -E 'CONFIG_(KSU|KSU_SUSFS|NOMOUNT|TCP_CONG_BBR|DEFAULT_TCP_CONG|ZRAM|CRYPTO_LZ4|CPU_FREQ_GOV_)' out/.config | sort > out/feature-config.txt
          cat out/feature-config.txt

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export CROSS_COMPILE="$(pwd)/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          export CLANG_TOOL_PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin/"
          export PATH="${CLANG_TOOL_PATH}:${PATH}"
          export BSP_BUILD_FAMILY=qogirl6
          export DTC_OVERLAY_TEST_EXT="$(pwd)/tools/mkdtimg/ufdt_apply_overlay"
          export DTC_OVERLAY_VTS_EXT="$(pwd)/tools/mkdtimg/ufdt_verify_overlay_host"
          export BSP_BUILD_ANDROID_OS=y
          export USE_CCACHE=1
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          # Do not call build_kernel.sh here: it runs defconfig again and would
          # discard the feature changes made in the previous step.
          make -C . O=out BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld \
            ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- -j"$(nproc)"
          test -s out/arch/arm64/boot/Image

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp out/arch/arm64/boot/Image artifact/Image-gta4lve-${KERNEL_VERSION}
          cp out/.config artifact/config-${KERNEL_VERSION}
          cp out/feature-config.txt artifact/feature-config.txt
          tar -C artifact -czf gta4lve-${KERNEL_VERSION}.tar.gz .

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta4lve-${{ env.KERNEL_VERSION }}
          path: |
            artifact/Image-gta4lve-${{ env.KERNEL_VERSION }}
            artifact/config-${{ env.KERNEL_VERSION }}
            artifact/feature-config.txt
            gta4lve-${{ env.KERNEL_VERSION }}.tar.gz
          if-no-files-found: error
